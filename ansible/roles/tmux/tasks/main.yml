- name: Ensure tmux installed (macOS)
  community.general.homebrew:
    name: tmux
    state: present
  when: ansible_system == 'Darwin'

- name: Ensure tmux installed (Debian)
  apt:
    name: tmux
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Check if ~/.tmux.conf exists
  stat:
    path: "~/.tmux.conf"
  register: tmuxconf

- name: Backup existing ~/.tmux.conf if present
  copy:
    src: "~/.tmux.conf"
    dest: "~/.tmux.conf.old"
    remote_src: yes
    force: yes
  when: tmuxconf.stat.exists

- name: Symlink tmux config from repo
  file:
    src: "{{ tmux_conf_src }}"
    dest: "~/.tmux.conf"
    state: link
    force: true
